version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: zcloud-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zcloud}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided in production}
      POSTGRES_DB: ${POSTGRES_DB:-zcloud_receptionist}
    expose:
      - "5432"
    networks:
      - zcloud-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zcloud} -d ${POSTGRES_DB:-zcloud_receptionist}"]
      interval: 10s
      timeout: 5s
      retries: 5

  control-plane:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zcloud-control-plane
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - zcloud-network
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-zcloud}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided in production}@postgres:5432/${POSTGRES_DB:-zcloud_receptionist}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY must be set in production}
      WORKER_API_SECRET: ${WORKER_API_SECRET:?WORKER_API_SECRET must be set in production}
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL must be set in production}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set in production}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set in production}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET must be set in production}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  voice-worker:
    build:
      context: ../ZCloud-AI-Telecaller
      dockerfile: Dockerfile
    container_name: zcloud-voice-worker
    restart: always
    depends_on:
      - control-plane
    networks:
      - zcloud-network
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL must be set in production}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY must be set in production}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET must be set in production}
      CONTROL_PLANE_URL: http://control-plane:3000
      WORKER_API_SECRET: ${WORKER_API_SECRET:?WORKER_API_SECRET must be set in production}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}

networks:
  zcloud-network:
    driver: bridge

volumes:
  postgres_data:
